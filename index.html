    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            color: #2d3748;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #e11d48;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #e11d48;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2);
        }

        @keyframes companyGlow {
            0% { opacity: 0.85; text-shadow: 0 0 2px rgba(225, 29, 72, 0.2); }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(225, 29, 72, 0.4), 0 0 20px rgba(30, 41, 59, 0.15); }
            100% { opacity: 0.85; text-shadow: 0 0 2px rgba(225, 29, 72, 0.2); }
        }

        .company-name {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: companyGlow 3.5s infinite ease-in-out;
        }

        .portal-subtitle {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        .exclusive-badge {
            background-color: #fff1f2;
            color: #be123c;
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 30px;
            border: 1px solid #fecdd3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-section {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #e11d48;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.12);
        }

        textarea {
            resize: vertical;
            height: 95px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        .note {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }

        @keyframes popupPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7);
            }
            70% {
                transform: scale(1.02);
                box-shadow: 0 0 0 14px rgba(225, 29, 72, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0);
            }
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 25px;
            animation: popupPulse 1.6s infinite ease-in-out;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.92;
        }

        @media (max-width: 650px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>

<body>

<div class="container">
    <div class="header">
        <div class="logo-container">
            <img src="GBP.png" alt="Company Logo" onerror="this.style.display='none'">
        </div>
        <div class="company-name">GLOBAL BOOK PUBLICATIONS</div>
        <div class="portal-subtitle">Official Exclusive Applicant Registration Portal</div>
    </div>

    <div class="exclusive-badge">
        ✨ <strong>Exclusive Notification:</strong> This application portal is strictly for Women & Girls only. ✨
    </div>

    <form action="https://formspree.io/f/moejeeaz" method="POST" enctype="multipart/form-data">
        
        <div class="form-section">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="Full_Name" required placeholder="Enter your full name">
        </div>

        <div class="form-section">
            <label for="guardian_name">Father's / Husband's Name:</label>
            <input type="text" id="guardian_name" name="Guardian_Name" required placeholder="Enter father's or husband's name">
        </div>

        <div class="row">
            <div class="col">
                <div class="form-section">
                    <label for="email">Gmail Address:</label>
                    <input type="email" id="email" name="Email" required placeholder="yourname@gmail.com">
                </div>
            </div>
            <div class="col">
                <div class="form-section">
                    <label for="whatsapp">WhatsApp Number:</label>
                    <input type="tel" id="whatsapp" name="WhatsApp_Number" required placeholder="10-digit mobile number" maxlength="10">
                </div>
            </div>
        </div>

        <div class="form-section">
            <label for="qualification">Educational Qualification:</label>
            <select id="qualification" name="Educational_Qualification" required>
                <option value="">-- Select Your Minimum Qualification --</option>
                <option value="12th Pass">12th Pass</option>
                <option value="Graduation">Graduation (BA / BSc / BCom / BTech / Other)</option>
                <option value="Post Graduation">Post Graduation (MA / MSc / MCom / MBA / Other)</option>
                <option value="Diploma / Other">Diploma / Other Qualifications</option>
            </select>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-section">
                    <label for="state">State:</label>
                    <select id="state" name="State" required onchange="updateDistricts()">
                        <option value="">-- Select State --</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                        <option value="Assam">Assam</option>
                        <option value="Bihar">Bihar</option>
